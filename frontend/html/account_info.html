<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Tài Khoản - HUI LEGION</title>
    <link rel="shortcut icon" href="../images/favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/user_center.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/loading.css">
</head>

<body>
    <!-- Nếu muốn có header giống trang chính thì bạn copy header ở đây -->

    <div class="user-page">
        <div class="user-card">
            <div class="user-card-header">
                <div>
                    <h1>Thông Tin Tài Khoản</h1>
                    <p>Xem và cập nhật thông tin cá nhân của bạn.</p>
                </div>
                <div class="user-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <form id="account-form" class="user-form">
                <div class="user-form-row">
                    <div class="user-form-group">
                        <label>Email (không thay đổi)</label>
                        <input type="email" id="acc-email" readonly>
                    </div>
                </div>

                <div class="user-form-row">
                    <div class="user-form-group">
                        <label>Họ và tên</label>
                        <input type="text" id="acc-name" placeholder="Nhập họ tên">
                    </div>
                    <div class="user-form-group">
                        <label>Số điện thoại</label>
                        <input type="text" id="acc-phone" placeholder="Nhập số điện thoại">
                    </div>
                </div>

                <div class="user-form-row">
                    <div class="user-form-group">
                        <label>Đổi mật khẩu</label>
                        <input type="password" id="old_password" placeholder="Nhập mật khẩu cũ">
                    </div>
                </div>

                <div class="user-form-row">
                    <div class="user-form-group">
                        <input type="password" id="new_password" placeholder="Nhập mật khẩu mới">
                    </div>
                </div>

                <div class="user-form-actions">
                    <button type="submit" class="btn-user btn-user-primary">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Lưu thay đổi</span>
                    </button>

                    <button type="button" id="btn-logout" class="btn-user btn-user-danger">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Thoát</span>
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="../js/core/app.js"></script>
    <script src="../js/core/toast.js"></script>
    <script src="../js/core/loading.js"></script>
    <script src="../js/core/session.js"></script>
    <script src="../js/features/layout/header.user.js"></script>
    <script src="../js/features/user/user.api.js"></script>
    <script src="../js/pages/account-info.page.js"></script>
</body>

</html>
