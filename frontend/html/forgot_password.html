<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - HUI LEGION</title>
  
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login_register.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/loading.css">
</head>
<body>
  <section class="auth-soft">
    <div class="auth-soft-left"><div class="soft-left-inner"><h1 class="soft-title-big">Khôi phục <span>mật khẩu</span></h1><p class="auth-desc">Nhập email để tạo mã đặt lại mật khẩu.</p></div></div>
    <div class="auth-soft-right"><div class="soft-form-wrapper"><h2>Quên mật khẩu</h2>
      <form id="forgot-password-form">
        <div class="soft-input"><label>Email</label><input type="email" id="forgot-email" placeholder="Nhập email"></div>
        <button class="soft-btn" type="submit">Tạo mã đặt lại</button>
        <div class="soft-input" style="margin-top:16px;"><label>Token đặt lại</label><input type="text" id="reset-token" placeholder="Token sẽ hiện ở đây khi demo"></div>
        <div class="soft-input"><label>Mật khẩu mới</label><input type="password" id="reset-new-password" placeholder="Nhập mật khẩu mới"></div>
        <button class="soft-btn-outline" type="button" id="btn-reset-password">Đặt lại mật khẩu</button>
        <p class="soft-switch"><a href="login.html">Quay lại đăng nhập</a></p>
      </form>
    </div></div>
  </section>
  <script src="../js/core/app.js"></script>
  <script src="../js/core/toast.js"></script>
  <script src="../js/core/loading.js"></script>
  <script src="../js/features/auth/auth.api.js"></script>
  <script src="../js/pages/forgot-password.page.js"></script>
</body>
</html>
