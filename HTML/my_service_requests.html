<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Yêu Cầu Dịch Vụ Của Tôi - HUI LEGION</title>
    <link rel="stylesheet" href="../fontawesome-free-6.6.0-web/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/user_center.css">
</head>

<body>

    <div class="user-page">
        <div class="user-card">
            <div class="user-card-header">
                <div>
                    <h1>Yêu Cầu Dịch Vụ Của Tôi</h1>
                    <p>Xem lịch sử yêu cầu sửa chữa, nâng cấp và bảo trì bằng tài khoản hiện tại.</p>
                </div>
                <div class="user-avatar">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
            </div>

            <div style="margin-top: 10px; text-align:right;">
                <button id="btn-back-home" class="btn-user btn-user-danger">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Thoát</span>
                </button>
            </div>

            <div id="service-empty" class="orders-empty" style="display:none;">
                <i class="fa-regular fa-face-smile-wink"></i>
                <p>Bạn chưa có yêu cầu dịch vụ nào.</p>
            </div>

            <div class="user-table-wrapper" id="service-wrapper" style="display:none;">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Mã yêu cầu</th>
                            <th>Ngày gửi</th>
                            <th>Thiết bị</th>
                            <th>Loại dịch vụ</th>
                            <th>Báo giá</th>
                            <th>Trạng thái</th>
                            <th>Chi tiết</th>
                        </tr>
                    </thead>
                    <tbody id="service-body">
                        <!-- JS render -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../JS/core/app.js"></script>
    <script src="../JS/core/session.js"></script>
    <script src="../JS/features/layout/header.user.js"></script>
<script src="../JS/features/layout/cart.guard.js"></script>
    <script src="../JS/features/repair/repair.api.js"></script>
    <script src="../JS/pages/my-service-requests.page.js"></script>
</body>

</html>
