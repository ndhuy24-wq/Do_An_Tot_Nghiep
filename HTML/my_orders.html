<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đơn Hàng Của Tôi - HUI LEGION</title>
    <link rel="shortcut icon" href="../Images/favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../fontawesome-free-6.6.0-web/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/user_center.css">
    
</head>

<body>
    <div id="header"></div>
    <div class="user-page">
        <div class="user-card">
            <div class="user-card-header">
                <div>
                    <h1>Đơn Hàng Của Tôi</h1>
                    <p>Xem lịch sử mua hàng bằng tài khoản hiện tại.</p>
                </div>
                <div class="user-avatar">
                    <i class="fa-solid fa-box"></i>
                </div>
            </div>
            <div style="margin-top: 10px; text-align:right;">
                <button id="btn-logout" class="btn-user btn-user-danger">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Thoát</span>
                </button>
            </div>

            <div id="orders-empty" class="orders-empty" style="display:none;">
                <i class="fa-regular fa-face-smile-wink"></i>
                <p>Bạn chưa có đơn hàng nào.</p>
            </div>

            <div class="user-table-wrapper" id="orders-wrapper" style="display:none;">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Chi tiết</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body">
                        <!-- JS render -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../JS/core/app.js"></script>
    <script src="../JS/core/session.js"></script>
    <script src="../JS/features/layout/header.user.js"></script>
    <script src="../JS/features/user/orders.api.js"></script>
    <script src="../JS/pages/my-orders.page.js"></script>
</body>

</html>
